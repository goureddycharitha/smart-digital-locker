# Server Configuration
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_digital_locker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Configuration (10MB limit)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
smartlocker.storage.location=${UPLOAD_DIR:./uploads}

# JWT Security Configuration (Defaults to secure 256-bit key)
smartlocker.jwt.secret=${JWT_SECRET:smart_digital_locker_secure_jwt_signing_secret_key_2026_production_safe}
smartlocker.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
smartlocker.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
