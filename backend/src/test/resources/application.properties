# In-memory H2 database for fast automated testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=users
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test Security settings
smartlocker.jwt.secret=test_secure_jwt_signing_secret_key_minimum_32_characters_for_unit_tests
smartlocker.jwt.expiration-ms=3600000
smartlocker.storage.location=./target/test-uploads
smartlocker.cors.allowed-origins=http://localhost:5173,http://localhost:3000
