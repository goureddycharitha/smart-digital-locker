services:
  # Spring Boot Backend (Docker Web Service)
  - type: web
    name: smart-digital-locker-backend
    runtime: docker
    dockerfilePath: backend-spring/Dockerfile
    dockerContext: backend-spring
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false # Set to your MySQL JDBC connection URL (e.g. from Aiven or Clever Cloud)
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: ALLOWED_ORIGINS
        sync: false # Set to your deployed frontend URL (e.g. https://smart-digital-locker.onrender.com)

  # React Frontend (Static Site)
  - type: web
    name: smart-digital-locker-frontend
    runtime: static
    rootDir: frontend-react
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to your backend URL (e.g. https://smart-digital-locker-backend.onrender.com/api)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
